name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, run `rsdroid doctor` and read the errors it prints.
        Do **not** open a public issue for a security vulnerability; see `SECURITY.md`.

        `rsdroid doctor --bundle` creates a ZIP locally. It is never uploaded
        automatically: review it for paths, usernames and log contents before attaching
        it here.

  - type: input
    id: version
    attributes:
      label: rsdroid version or commit
      placeholder: "0.1.0-alpha.0 or the commit SHA"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Output of `winver`, including the build number.
      placeholder: "Windows 10 22H2, build 19045.xxxx"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: The actual behavior, including the exact command and full error text.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      description: Paste `rsdroid doctor` output or attach the ZIP after reviewing it.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and the troubleshooting notes.
          required: true
        - label: I removed secrets, tokens and personal paths from anything attached.
          required: true
        - label: This is not a security vulnerability, and I did not include a VM image or other large binary.
          required: true
